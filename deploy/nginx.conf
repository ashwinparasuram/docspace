# Alternative to Caddy: Nginx reverse proxy (TLS certificates managed separately, e.g. certbot).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream docspace { server 127.0.0.1:4000; keepalive 32; }

server {
  listen 80;
  server_name docs.example.com;
  client_max_body_size 60m;

  location / {
    proxy_pass http://docspace;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;          # real-time collaboration websockets
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;                              # streaming AI answers (SSE)
    proxy_read_timeout 3600s;
  }
}
