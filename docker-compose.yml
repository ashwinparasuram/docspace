# Self-hosted stack: app + MySQL + Redis + Caddy (automatic HTTPS for custom domains).
#   cp .env.example .env   (set APP_SECRET, APP_URL)   then:   docker compose up -d
# Optional S3-compatible storage:   docker compose --profile s3 up -d   (and set STORAGE_DRIVER=s3)
# Optional local AI:                docker compose --profile ai up -d   (and set AI_PROVIDER=ollama)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_USER: docspace
      DB_PASSWORD: ${DB_PASSWORD:-docspace}
      DB_NAME: docspace
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}
      TRUST_PROXY: "true"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    # Scale horizontally with: docker compose up -d --scale app=3 (Redis keeps collaboration in sync)
    expose:
      - "4000"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: docspace
      MYSQL_USER: docspace
      MYSQL_PASSWORD: ${DB_PASSWORD:-docspace}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-ft-min-token-size=2"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    depends_on:
      - app

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-docspace}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-docspace-secret}
    volumes:
      - minio:/data

  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  uploads:
  mysql:
  redis:
  caddy_data:
  minio:
  ollama:
